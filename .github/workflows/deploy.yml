name: Deploy Backend to EC2

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name:Self-hosted
        # Uncomment if you use TypeScript or a build step:
        # run: npm run build

      - name: Create or inject environment variables
        # If your app needs a .env file, add your secrets in GitHub repo settings
        # (Settings -> Secrets and variables -> Actions)
        run: |
          echo "PORT=5000" > .env
          # echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env

      - name: Deploy with PM2
        run: |
          # Start app if not running, or reload with zero-downtime
          pm2 describe queueos-backend > /dev/null 2>&1 && pm2 reload queueos-backend || pm2 start index.js --name queueos-backend
          pm2 save
